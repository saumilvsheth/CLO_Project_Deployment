[project]
name = "clo-document-intelligence"
version = "0.1.0"
description = "CLO document intelligence: extract, validate, and review trustee reports and related PDFs on Azure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.21.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "azure-ai-documentintelligence>=1.0.0",
]

[project.scripts]
clo-intel = "clo_intel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
