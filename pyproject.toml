[project]
name = "graph-rag"
version = "0.1.0"
description = "Simple Graph RAG over PDFs using Microsoft Agent Framework and Azure Cosmos DB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.15.0",
    "agent-framework-azure-cosmos>=1.0.0b260821",
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.21.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
]

[project.scripts]
graph-rag = "graph_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
